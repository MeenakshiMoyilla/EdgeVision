<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Create Account | EdgeVision</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
```

</head>

<body>

```
<nav class="navbar">

    <div class="nav-container">

        <a
            href="{{ url_for('landing') }}"
            class="logo"
        >
            Edge<span>Vision</span>
        </a>

        <div class="nav-links">

            <a href="{{ url_for('landing') }}">
                Home
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                EV
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Create your EdgeVision account
                to start analyzing images.
            </p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="{{ url_for('register') }}"
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </p>

        </div>

    </div>

</main>


<footer class="footer">

    <p>
        © 2026 EdgeVision. Image Edge Analysis Platform.
    </p>

</footer>
```

</body>
</html>
