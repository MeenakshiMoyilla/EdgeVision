<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | EdgeVision</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

```
<!-- Navbar -->
<nav class="navbar">

    <div class="nav-container">

        <a href="{{ url_for('landing') }}" class="logo">
            Edge<span>Vision</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('landing') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
        </div>

    </div>

</nav>


<!-- Login Section -->
<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                EV
            </div>

            <h1>Welcome Back</h1>

            <p>
                Login to continue analyzing your images
                with EdgeVision.
            </p>

        </div>


        <!-- Error Message -->
        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <!-- Login Form -->
        <form
            action="{{ url_for('login') }}"
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create an account
                </a>
            </p>

        </div>

    </div>

</main>


<!-- Footer -->
<footer class="footer">

    <p>
        © 2026 EdgeVision. Image Edge Analysis Platform.
    </p>

</footer>
```

</body>
</html>
