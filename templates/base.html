<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        EdgeVision
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    
    <link rel="icon" type="image/png"
        href="{{ url_for('static', filename='favicon.png') }}">
    

</head>


<body>

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{{ url_for('landing') }}"
                class="logo"
            >
                Edge<span>Vision</span>
            </a>


            <div class="nav-links">

                {% if session.get("user_id") %}

                    <a href="{{ url_for('dashboard') }}">
                        Dashboard
                    </a>

                    <a href="{{ url_for('analyze') }}">
                        Analyze
                    </a>

                    <a
                        href="{{ url_for('logout') }}"
                        class="nav-button"
                    >
                        Logout
                    </a>

                {% else %}

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                    <a
                        href="{{ url_for('register') }}"
                        class="nav-button"
                    >
                        Get Started
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>


    {% block content %}
    {% endblock %}


    <footer>

        <p>
            © 2026 EdgeVision.
            Image Edge Detection Platform.
        </p>

    </footer>

</body>

</html>
